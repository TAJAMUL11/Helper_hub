name: Daily Helper-Hub Auto-Committer

# Disabled workflow - schedule removed to prevent commits to profile
on: [] # Disabled trigger - workflow will not execute on schedule or dispatch

permissions:
  contents: write
  issues: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history to check today's commits accurately

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git
        run: |
          git config --global user.name "Tajamul Wani"
          git config --global user.email "thetj4054@gmail.com"

      - name: Run Auto-Commit Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node auto-commit.js

      - name: Push Changes
        run: |
          # Only push if there are local commits that aren't on remote
          git push origin main || echo "No changes to push or push failed"
